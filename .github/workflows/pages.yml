name: Deploy to GitHub Pages

# Triggers on every push to main, plus a manual "Run workflow" button in the
# Actions tab. The workflow has two jobs:
#   build  — checks out, syncs src/presets.py → docs/dashboard.html, stages
#            .brand/ and assets/ into docs/, packages docs/ as a Pages artifact.
#   deploy — publishes that artifact to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; queue further pushes rather than cancel
# them, so a fast follow-up commit doesn't lose its build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync presets.py → docs/dashboard.html
        run: python scripts/sync_presets.py

      - name: Stage brand + assets into docs/
        # docs/ is the publish root; .brand/ stays at the repo root so the
        # README's GitHub-rendered footer keeps resolving. Copy both into
        # docs/ at build time so the deployed site can find them.
        run: |
          cp -r .brand docs/.brand
          cp -r assets docs/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish docs/. GitHub Pages serves docs/index.html as the root;
          # dashboard.html is reachable at /dashboard.html.
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
